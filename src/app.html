<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Drawn by scripts/build-logo.js. The PNGs are for browsers without SVG
		     icons, and for iOS, which only takes a PNG on the home screen. -->
		<link rel="icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" type="image/png" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<!-- The quiz prompt needs this font on first paint. Fetching it now runs in
		     parallel with the large globe bundle, not after it. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/atkinson-hyperlegible-next.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- --surface in styles.css, so the browser bar matches the header. -->
		<meta name="theme-color" content="#1c1d1f" />
		<meta
			name="description"
			content="Learn world and United States geography. Find regions on a 3D globe."
		/>
		<style>
			/* Painted from the HTML itself, before any JavaScript runs. The app is
			   client-rendered and its bundle carries a WebGL engine, so without this
			   the first thing a visitor sees is a blank page for as long as that
			   takes to arrive and parse. Removed by the app once it mounts.

			   The colours copy --night, --ink and --accent in styles.css, which
			   has not loaded yet when this paints. */
			#boot {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.25rem;
				background: #060a18;
				color: #ffffff;
				font-family: system-ui, sans-serif;
			}
			#boot .logo {
				margin-bottom: -0.5rem;
			}
			#boot .mark {
				font-size: 2.5rem;
				font-weight: 700;
				letter-spacing: 0.02em;
			}
			#boot .spinner {
				width: 2rem;
				height: 2rem;
				border: 3px solid rgba(255, 255, 255, 0.15);
				border-top-color: #cc79a7;
				border-radius: 50%;
				animation: boot-spin 900ms linear infinite;
			}
			@keyframes boot-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#boot .spinner {
					animation: none;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot">
			<img class="logo" src="%sveltekit.assets%/favicon.svg" width="72" height="72" alt="" />
			<div class="mark">Zonia</div>
			<div class="spinner" role="status" aria-label="Loading"></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
